<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snipandshot | Fashion & Portrait Photographer</title>
  <meta name="description" content="Portfolio of Snipandshot, fashion and portrait photographer based in Jakarta.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="/" class="wordmark">Snipandshot</a>
    <p class="tagline">Fashion &amp; portrait photographer, Jakarta</p>
    <button class="menu-toggle" aria-expanded="false" aria-controls="main-nav">Menu</button>
    <nav class="nav" id="main-nav">
      <a href="/" aria-current="page">Portfolio</a>
      <a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>
      <a href="https://instagram.com/yourhandle" target="_blank" rel="noopener">Instagram</a>
    </nav>
  </header>

  <main>
    <div class="filters" role="group" aria-label="Filter photographs">
      <button data-filter="all" aria-pressed="true">All work</button>
      <button data-filter="fashion" aria-pressed="false">Fashion</button>
      <button data-filter="beauty" aria-pressed="false">Beauty</button>
      <button data-filter="portrait" aria-pressed="false">Portrait</button>
      <button data-filter="editorial" aria-pressed="false">Editorial</button>
    </div>

    <!-- To add your own photo: copy one <figure>, set data-category,
         and point src / data-full to a file in the /images folder. -->
    <section class="gallery" aria-label="Portfolio">
      <figure data-category="fashion">
        <img src="https://picsum.photos/seed/portfolio1/800/1100" data-full="https://picsum.photos/seed/portfolio1/1600/2200" width="800" height="1100" alt="Fashion photograph 1" loading="lazy">
      </figure>
      <figure data-category="beauty">
        <img src="https://picsum.photos/seed/portfolio2/800/1000" data-full="https://picsum.photos/seed/portfolio2/1600/2000" width="800" height="1000" alt="Beauty photograph 2" loading="lazy">
      </figure>
      <figure data-category="portrait">
        <img src="https://picsum.photos/seed/portfolio3/800/1200" data-full="https://picsum.photos/seed/portfolio3/1600/2400" width="800" height="1200" alt="Portrait photograph 3" loading="lazy">
      </figure>
      <figure data-category="editorial">
        <img src="https://picsum.photos/seed/portfolio4/800/600" data-full="https://picsum.photos/seed/portfolio4/1600/1200" width="800" height="600" alt="Editorial photograph 4" loading="lazy">
      </figure>
      <figure data-category="fashion">
        <img src="https://picsum.photos/seed/portfolio5/800/1050" data-full="https://picsum.photos/seed/portfolio5/1600/2100" width="800" height="1050" alt="Fashion photograph 5" loading="lazy">
      </figure>
      <figure data-category="portrait">
        <img src="https://picsum.photos/seed/portfolio6/800/800" data-full="https://picsum.photos/seed/portfolio6/1600/1600" width="800" height="800" alt="Portrait photograph 6" loading="lazy">
      </figure>
      <figure data-category="beauty">
        <img src="https://picsum.photos/seed/portfolio7/800/1100" data-full="https://picsum.photos/seed/portfolio7/1600/2200" width="800" height="1100" alt="Beauty photograph 7" loading="lazy">
      </figure>
      <figure data-category="editorial">
        <img src="https://picsum.photos/seed/portfolio8/800/1000" data-full="https://picsum.photos/seed/portfolio8/1600/2000" width="800" height="1000" alt="Editorial photograph 8" loading="lazy">
      </figure>
      <figure data-category="fashion">
        <img src="https://picsum.photos/seed/portfolio9/800/1200" data-full="https://picsum.photos/seed/portfolio9/1600/2400" width="800" height="1200" alt="Fashion photograph 9" loading="lazy">
      </figure>
      <figure data-category="portrait">
        <img src="https://picsum.photos/seed/portfolio10/800/600" data-full="https://picsum.photos/seed/portfolio10/1600/1200" width="800" height="600" alt="Portrait photograph 10" loading="lazy">
      </figure>
      <figure data-category="editorial">
        <img src="https://picsum.photos/seed/portfolio11/800/1050" data-full="https://picsum.photos/seed/portfolio11/1600/2100" width="800" height="1050" alt="Editorial photograph 11" loading="lazy">
      </figure>
      <figure data-category="beauty">
        <img src="https://picsum.photos/seed/portfolio12/800/800" data-full="https://picsum.photos/seed/portfolio12/1600/1600" width="800" height="800" alt="Beauty photograph 12" loading="lazy">
      </figure>
      <figure data-category="fashion">
        <img src="https://picsum.photos/seed/portfolio13/800/1100" data-full="https://picsum.photos/seed/portfolio13/1600/2200" width="800" height="1100" alt="Fashion photograph 13" loading="lazy">
      </figure>
      <figure data-category="portrait">
        <img src="https://picsum.photos/seed/portfolio14/800/1000" data-full="https://picsum.photos/seed/portfolio14/1600/2000" width="800" height="1000" alt="Portrait photograph 14" loading="lazy">
      </figure>
      <figure data-category="editorial">
        <img src="https://picsum.photos/seed/portfolio15/800/1200" data-full="https://picsum.photos/seed/portfolio15/1600/2400" width="800" height="1200" alt="Editorial photograph 15" loading="lazy">
      </figure>
      <figure data-category="beauty">
        <img src="https://picsum.photos/seed/portfolio16/800/600" data-full="https://picsum.photos/seed/portfolio16/1600/1200" width="800" height="600" alt="Beauty photograph 16" loading="lazy">
      </figure>
      <figure data-category="fashion">
        <img src="https://picsum.photos/seed/portfolio17/800/1050" data-full="https://picsum.photos/seed/portfolio17/1600/2100" width="800" height="1050" alt="Fashion photograph 17" loading="lazy">
      </figure>
      <figure data-category="portrait">
        <img src="https://picsum.photos/seed/portfolio18/800/800" data-full="https://picsum.photos/seed/portfolio18/1600/1600" width="800" height="800" alt="Portrait photograph 18" loading="lazy">
      </figure>
    </section>
  </main>

  <div class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-close">Close</button>
    <button class="lb-prev" aria-label="Previous photo">Previous</button>
    <img src="" alt="">
    <button class="lb-next" aria-label="Next photo">Next</button>
    <span class="lb-count"></span>
  </div>

  <footer class="site-footer">
    <nav>
      <a href="https://instagram.com/snipandshot" target="_blank" rel="noopener">Instagram</a>
      <a href="mailto:snipandshots@gmail.com.com">snipandshots@gmail.com</a>
    </nav>
    <p>&copy; <span id="year"></span> Snipandshot. All images are copyrighted.</p>
  </footer>
  <script src="/assets/js/main.js"></script>
</body>
</html>
